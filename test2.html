<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice check · BEKER</title>
<link rel="stylesheet" href="test2.css">
</head>
<body>
<h1>Invoice check</h1>
<div class="mut">Compare a supplier invoice (PDF) with the CRM état (pasted text or Excel/CSV), line by line.</div>

<div class="box">
  <div class="card">
    <label for="fi">1 · Invoice (PDF)</label>
    <input id="fi" type="file" accept=".pdf">
  </div>

  <div class="card">
    <label for="pt">2 · CRM état: copy from the CRM and paste here</label>
    <textarea id="pt" rows="6" placeholder="Paste the rows here (with the header line if possible)"></textarea>
    <label for="fc" style="margin-top:8px">or upload a file (Excel / CSV)</label>
    <input id="fc" type="file" accept=".xlsx,.xls,.csv">
  </div>

  <div class="card">
    <label for="tot">Total HT Brut of the invoice (auto-read, editable)</label>
    <input id="tot" type="text" placeholder="e.g. 123 456,78">
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="go">Run check</button>
      <button id="ex" class="sec" hidden>Export CSV</button>
    </div>
    <label class="chk" id="aiw"><input type="checkbox" id="ai"> Force AI reading (scanned or unusual invoices)</label>
  </div>
</div>

<div id="st" class="mut"></div>
<div id="out"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="test2.js"></script>
</body>
</html>
